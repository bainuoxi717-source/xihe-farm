<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>溪禾手记 · 尺寸测试</title><style>body{margin:0;padding:14px;background:#eee;font:12px system-ui}nav{display:flex;gap:15px;margin-bottom:12px}a{color:#244c3c}iframe{border:0;background:#fff;transform-origin:top left}#holder{overflow:hidden}#report{margin-bottom:10px;line-height:1.7;white-space:pre-wrap}</style><nav><a href="?width=1440">1440 桌面</a><a href="?width=390">390 手机</a><a href="?width=320">320 小屏</a><a href="/">返回游戏</a></nav><div id="report"></div><div id="holder"><iframe title="尺寸测试中的溪禾手记" src="/"></iframe></div><script>const width=Number(new URLSearchParams(location.search).get('width'))||1440;const frame=document.querySelector('iframe');frame.width=width;frame.height=width>900?900:844;const scale=Math.min(1,(innerWidth-28)/width);frame.style.transform=`scale(${scale})`;document.querySelector('#holder').style.height=frame.height*scale+'px';frame.addEventListener('load',()=>{const d=frame.contentDocument;const inspect=()=>{const overflow=d.documentElement.scrollWidth>width;document.querySelector('#report').textContent=`实际布局 ${width} × ${frame.height}px · ${overflow?'出现横向溢出':'无横向溢出'}\n内容宽度 ${d.documentElement.scrollWidth}px · WebGL画布 ${d.querySelector('#world canvas')?'已创建':'未创建'} · 标题：${d.title}`;};inspect();new MutationObserver(inspect).observe(d.querySelector('#hud'),{childList:true,subtree:true});});</script></html>
